<!doctype html><html lang="de-CH"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#142c58"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="English Matura"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="manifest" href="manifest.webmanifest"><title>English Matura</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fc;color:#182945;font-family:system-ui,-apple-system,sans-serif}header{background:#142c58;color:white;padding:20px}header>div,main{max-width:760px;margin:auto}header>div{display:flex;gap:15px;align-items:center}header img{height:70px;width:70px;border-radius:17px}h1{margin:0;font-size:1.5rem}header p{margin:4px 0;color:#cdddf5}main{padding:16px}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}nav button{flex:1;min-width:125px;border:1px solid #cfdbec;padding:13px 9px;background:white;color:#254a91;font-weight:700;border-radius:12px;font-size:.94rem}nav button.active{color:white;background:#254a91}section{background:white;border:1px solid #dce5f3;border-radius:16px;padding:20px;margin-bottom:14px}h2{margin-top:4px}.fr{font-weight:650;font-size:1.37rem;line-height:1.48;margin:16px 0}.de{background:#eef3fc;padding:13px;border-left:4px solid #648bd2;border-radius:8px}.muted{font-size:.9rem;color:#677994}.btn{background:#254a91;border:0;border-radius:12px;padding:14px;color:white;font-weight:700;font-size:1rem;width:100%;margin-top:12px}.alt{background:#eaf1fc;color:#254a91}.green{background:#17744e}.red{background:#fff1f1;color:#a34141}textarea{font:1.05rem/1.5 system-ui;width:100%;min-height:120px;padding:12px;border:1px solid #9fafd0;border-radius:12px}.row{display:flex;gap:9px;flex-wrap:wrap}.row .btn{flex:1;min-width:160px}.result{padding:13px;border-radius:10px;background:#fff2eb;margin-top:14px}.result.ok{background:#edf8f1}.item{background:white;border:1px solid #dae5f1;border-radius:14px;padding:16px;margin-bottom:10px}.eyebrow{color:#536c95;text-transform:uppercase;font-weight:800;letter-spacing:.07em;font-size:.77rem}</style></head><body><header><div><img src="icon.svg" alt="Icon"><div><h1>English Matura</h1><p>60 Sätze für Aufsatz · 60 Sätze für Mündlich</p></div></div></header><main><nav><button id="m-essay" onclick="setMode('essay')">✍️ Aufsatz</button><button id="m-oral" onclick="setMode('oral')">🎙️ Mündlich</button></nav><nav><button id="v-today" onclick="setView('today')">Satz des Tages</button><button id="v-collection" onclick="setView('collection')">Sammlung (<span id="count">0</span>)</button><button id="v-practice" onclick="setView('practice')">Repetieren</button></nav><div id="app"></div><p class="muted">Der Lernstand wird lokal im Browser gespeichert. Der Satz des Tages wechselt täglich; nach 60 Tagen beginnt die Folge erneut. Die Korrektur vergleicht mit dem Musterwortlaut.</p><section id="badge-panel"></section></main><script src="push-config.js"></script><script>const BANK={"essay":[["It is important to consider the issue from different perspectives.","Es ist wichtig, die Frage aus unterschiedlichen Blickwinkeln zu betrachten."],["This topic raises several questions that deserve careful consideration.","Dieses Thema wirft mehrere Fragen auf, die sorgfältig bedacht werden sollten."],["There are convincing arguments on both sides of the debate.","Auf beiden Seiten der Debatte gibt es überzeugende Argumente."],["It would be a mistake to ignore the broader context.","Es wäre ein Fehler, den grösseren Zusammenhang zu ignorieren."],["The situation is more complex than it may seem at first glance.","Die Situation ist komplexer, als sie auf den ersten Blick erscheinen mag."],["A balanced approach is essential when discussing this issue.","Eine ausgewogene Herangehensweise ist bei der Diskussion dieser Frage wesentlich."],["It is worth examining the potential long-term consequences.","Es lohnt sich, die möglichen langfristigen Folgen zu untersuchen."],["Different people may reach different conclusions for valid reasons.","Verschiedene Menschen können aus nachvollziehbaren Gründen zu unterschiedlichen Schlussfolgerungen kommen."],["This argument should not be accepted without further examination.","Dieses Argument sollte nicht ohne weitere Prüfung akzeptiert werden."],["One must distinguish between personal opinions and established facts.","Man muss zwischen persönlichen Meinungen und gesicherten Tatsachen unterscheiden."],["Several factors need to be taken into account.","Mehrere Faktoren müssen berücksichtigt werden."],["It is difficult to find a solution that satisfies everyone.","Es ist schwierig, eine Lösung zu finden, die alle zufriedenstellt."],["This raises the question of how far we should go.","Dies wirft die Frage auf, wie weit wir gehen sollten."],["There is no simple answer to such a complex question.","Auf eine so komplexe Frage gibt es keine einfache Antwort."],["This example illustrates the importance of thinking critically.","Dieses Beispiel verdeutlicht, wie wichtig kritisches Denken ist."],["It is reasonable to question the assumptions behind this claim.","Es ist vernünftig, die Annahmen hinter dieser Behauptung zu hinterfragen."],["A closer examination reveals both strengths and weaknesses.","Eine genauere Betrachtung zeigt sowohl Stärken als auch Schwächen."],["At the same time, we should not overlook the possible drawbacks.","Gleichzeitig sollten wir die möglichen Nachteile nicht übersehen."],["The issue cannot be reduced to a single cause.","Die Frage lässt sich nicht auf eine einzige Ursache reduzieren."],["It is useful to compare the short-term and long-term effects.","Es ist sinnvoll, die kurz- und langfristigen Auswirkungen zu vergleichen."],["The advantages must be weighed against the disadvantages.","Die Vorteile müssen gegen die Nachteile abgewogen werden."],["In my view, the most convincing approach is a balanced one.","Meiner Ansicht nach ist eine ausgewogene Herangehensweise am überzeugendsten."],["However, this point of view is not without its limitations.","Allerdings hat auch dieser Standpunkt seine Grenzen."],["This perspective highlights an aspect that is often overlooked.","Diese Perspektive beleuchtet einen Aspekt, der oft übersehen wird."],["It is important to recognise that circumstances can change.","Es ist wichtig anzuerkennen, dass sich Umstände verändern können."],["What works in one situation may not work in another.","Was in einer Situation funktioniert, muss in einer anderen nicht funktionieren."],["A more nuanced discussion could lead to better solutions.","Eine differenziertere Diskussion könnte zu besseren Lösungen führen."],["The consequences of a decision may not be immediately apparent.","Die Folgen einer Entscheidung sind möglicherweise nicht sofort erkennbar."],["This suggests that further reflection is necessary.","Dies deutet darauf hin, dass weitere Überlegungen nötig sind."],["It is essential to remain open to alternative viewpoints.","Es ist wesentlich, für andere Sichtweisen offen zu bleiben."],["An effective solution requires both careful planning and flexibility.","Eine wirksame Lösung erfordert sowohl sorgfältige Planung als auch Flexibilität."],["This observation leads to another important question.","Diese Beobachtung führt zu einer weiteren wichtigen Frage."],["Before reaching a conclusion, we should examine the evidence.","Bevor wir eine Schlussfolgerung ziehen, sollten wir die Belege prüfen."],["It is possible to disagree without dismissing the other person's arguments.","Man kann anderer Meinung sein, ohne die Argumente des Gegenübers abzuwerten."],["The discussion becomes more productive when different perspectives are respected.","Die Diskussion wird konstruktiver, wenn unterschiedliche Sichtweisen respektiert werden."],["It is necessary to consider the needs of those affected.","Es ist notwendig, die Bedürfnisse der Betroffenen zu berücksichtigen."],["The same issue can be interpreted in several ways.","Dieselbe Frage kann auf verschiedene Arten interpretiert werden."],["It would be unwise to draw general conclusions from a single example.","Es wäre unklug, aus einem einzigen Beispiel allgemeine Schlüsse zu ziehen."],["Personal experiences often influence the way we judge a situation.","Persönliche Erfahrungen beeinflussen oft, wie wir eine Situation beurteilen."],["This does not necessarily mean that the opposite view is wrong.","Das bedeutet nicht zwangsläufig, dass die gegenteilige Ansicht falsch ist."],["Nevertheless, some objections deserve serious attention.","Dennoch verdienen einige Einwände ernsthafte Beachtung."],["A willingness to compromise can help overcome disagreements.","Kompromissbereitschaft kann helfen, Meinungsverschiedenheiten zu überwinden."],["The question should be approached with an open mind.","Man sollte sich der Frage unvoreingenommen nähern."],["It is important to consider what might happen in the future.","Es ist wichtig zu bedenken, was in Zukunft geschehen könnte."],["The benefits of this approach are clear, but so are its risks.","Die Vorteile dieses Ansatzes sind klar, aber auch seine Risiken."],["The wider implications should not be underestimated.","Die weiterreichenden Folgen sollten nicht unterschätzt werden."],["This is an issue that affects individuals as well as society.","Dies ist eine Frage, die sowohl Einzelne als auch die Gesellschaft betrifft."],["It is easier to criticise a problem than to solve it.","Es ist einfacher, ein Problem zu kritisieren, als es zu lösen."],["Even a well-intentioned decision can have unintended consequences.","Selbst eine gut gemeinte Entscheidung kann unbeabsichtigte Folgen haben."],["A useful starting point is to identify the underlying problem.","Ein sinnvoller Ausgangspunkt besteht darin, das zugrunde liegende Problem zu erkennen."],["The challenge is to find a fair and practical compromise.","Die Herausforderung besteht darin, einen fairen und praktikablen Kompromiss zu finden."],["This argument becomes stronger when supported by concrete examples.","Dieses Argument wird überzeugender, wenn es durch konkrete Beispiele gestützt wird."],["Not everyone will agree on what matters most.","Nicht alle werden sich darüber einig sein, was am wichtigsten ist."],["In addition, the social and cultural context may play a role.","Ausserdem kann der soziale und kulturelle Kontext eine Rolle spielen."],["It is therefore important to avoid hasty judgements.","Deshalb ist es wichtig, vorschnelle Urteile zu vermeiden."],["From a broader perspective, the issue raises fundamental questions.","Aus einer umfassenderen Perspektive wirft die Frage grundlegende Fragen auf."],["Ultimately, the answer may depend on individual priorities.","Letztlich kann die Antwort von den persönlichen Prioritäten abhängen."],["Taking all these points into consideration, a balanced conclusion seems most appropriate.","Unter Berücksichtigung all dieser Punkte erscheint eine ausgewogene Schlussfolgerung am sinnvollsten."],["Although no solution is perfect, some approaches are more convincing than others.","Obwohl keine Lösung perfekt ist, sind manche Ansätze überzeugender als andere."],["In conclusion, this issue deserves continued attention and thoughtful discussion.","Abschliessend verdient diese Frage weiterhin Aufmerksamkeit und eine sorgfältige Diskussion."]],"oral":[["I would like to begin by briefly introducing the work.","Ich möchte damit beginnen, das Werk kurz vorzustellen."],["The main theme of the text becomes clear as the story develops.","Das Hauptthema des Textes wird im Verlauf der Geschichte deutlich."],["This passage can be understood in several different ways.","Diese Textstelle kann auf verschiedene Arten verstanden werden."],["It is important to consider the context of this scene.","Es ist wichtig, den Kontext dieser Szene zu berücksichtigen."],["I would now like to focus on the main character.","Ich möchte mich nun auf die Hauptfigur konzentrieren."],["The relationship between the characters is worth examining.","Es lohnt sich, die Beziehung zwischen den Figuren zu untersuchen."],["The author's choice of words deserves closer attention.","Die Wortwahl des Autors verdient eine genauere Betrachtung."],["One possible interpretation is that this moment marks a turning point.","Eine mögliche Interpretation ist, dass dieser Moment einen Wendepunkt darstellt."],["This detail may be more significant than it first appears.","Dieses Detail könnte bedeutsamer sein, als es zunächst scheint."],["The narrator's perspective influences the way we understand the events.","Die Erzählperspektive beeinflusst, wie wir die Ereignisse verstehen."],["It is interesting to consider the effect on the reader.","Es ist interessant, die Wirkung auf die Lesenden zu betrachten."],["I would argue that this passage reveals an important conflict.","Ich würde argumentieren, dass diese Textstelle einen wichtigen Konflikt aufzeigt."],["This scene raises questions about the character's motivations.","Diese Szene wirft Fragen zu den Beweggründen der Figur auf."],["The atmosphere contributes to the overall impression of the text.","Die Atmosphäre trägt zum Gesamteindruck des Textes bei."],["I find the contrast between these two elements particularly striking.","Ich finde den Gegensatz zwischen diesen beiden Elementen besonders auffällig."],["This quotation could support a number of interpretations.","Dieses Zitat könnte verschiedene Interpretationen stützen."],["The passage invites the reader to reflect on a broader issue.","Die Textstelle regt die Lesenden an, über eine umfassendere Frage nachzudenken."],["I would like to explain why this detail matters.","Ich möchte erklären, warum dieses Detail wichtig ist."],["Another aspect worth considering is the structure of the text.","Ein weiterer interessanter Aspekt ist der Aufbau des Textes."],["The ending leaves room for different interpretations.","Das Ende lässt Raum für unterschiedliche Interpretationen."],["This choice may have been deliberate rather than accidental.","Diese Entscheidung könnte bewusst und nicht zufällig getroffen worden sein."],["The language used here helps create a particular mood.","Die hier verwendete Sprache trägt dazu bei, eine bestimmte Stimmung zu erzeugen."],["The character's behaviour can be interpreted in different ways.","Das Verhalten der Figur lässt sich unterschiedlich interpretieren."],["There seems to be a tension between appearance and reality.","Es scheint eine Spannung zwischen Schein und Wirklichkeit zu geben."],["The author may be encouraging the reader to question certain assumptions.","Der Autor könnte die Lesenden dazu anregen, gewisse Annahmen zu hinterfragen."],["This part of the story is especially interesting to analyse.","Dieser Teil der Geschichte ist besonders interessant zu analysieren."],["The text can be linked to experiences that many people share.","Der Text lässt sich mit Erfahrungen verbinden, die viele Menschen teilen."],["I would like to draw attention to a recurring detail.","Ich möchte auf ein wiederkehrendes Detail aufmerksam machen."],["The repeated image may have a symbolic meaning.","Das wiederholte Bild könnte eine symbolische Bedeutung haben."],["It is useful to distinguish between what is said and what is implied.","Es ist sinnvoll, zwischen dem Gesagten und dem Angedeuteten zu unterscheiden."],["The reader may not immediately understand the character's intentions.","Die Lesenden verstehen die Absichten der Figur möglicherweise nicht sofort."],["This passage sheds light on the relationship between the characters.","Diese Textstelle beleuchtet die Beziehung zwischen den Figuren."],["The way the story is told is just as important as the events themselves.","Die Art, wie die Geschichte erzählt wird, ist ebenso wichtig wie die Ereignisse selbst."],["In my opinion, this is one of the most thought-provoking aspects of the text.","Meiner Meinung nach ist dies einer der Aspekte des Textes, die am meisten zum Nachdenken anregen."],["There are several details that support this interpretation.","Es gibt mehrere Details, die diese Interpretation stützen."],["It is also possible to read this scene from a different perspective.","Es ist auch möglich, diese Szene aus einem anderen Blickwinkel zu betrachten."],["This moment could reveal something about the character's inner conflict.","Dieser Moment könnte etwas über den inneren Konflikt der Figur offenbaren."],["I would now like to examine the significance of this quotation.","Ich möchte nun die Bedeutung dieses Zitats untersuchen."],["The author's style helps shape the reader's expectations.","Der Stil des Autors prägt die Erwartungen der Lesenden mit."],["This raises the question of whether the narrator can be trusted.","Dies wirft die Frage auf, ob man dem Erzähler vertrauen kann."],["It is worth asking why the author included this detail.","Es lohnt sich zu fragen, warum der Autor dieses Detail aufgenommen hat."],["The passage may also be connected to the work's central message.","Die Textstelle könnte auch mit der zentralen Aussage des Werks zusammenhängen."],["The character appears to be facing a difficult choice.","Die Figur scheint vor einer schwierigen Entscheidung zu stehen."],["This interpretation is plausible, although it is not the only one.","Diese Interpretation ist plausibel, auch wenn sie nicht die einzige ist."],["The distinction between the characters becomes clearer in this scene.","Der Unterschied zwischen den Figuren wird in dieser Szene deutlicher."],["The text encourages us to consider different points of view.","Der Text regt uns dazu an, unterschiedliche Standpunkte zu berücksichtigen."],["I would like to compare this moment with an earlier passage.","Ich möchte diesen Moment mit einer früheren Textstelle vergleichen."],["The use of imagery adds another layer of meaning.","Der Einsatz bildhafter Sprache fügt eine weitere Bedeutungsebene hinzu."],["I think it is important to avoid interpreting the scene too literally.","Ich denke, es ist wichtig, die Szene nicht allzu wörtlich zu interpretieren."],["The events can be seen as part of a wider development.","Die Ereignisse können als Teil einer umfassenderen Entwicklung betrachtet werden."],["The tone of this passage differs from that of the previous one.","Der Ton dieser Textstelle unterscheidet sich von jenem der vorherigen."],["The conflict may reflect a problem that extends beyond the story.","Der Konflikt könnte ein Problem widerspiegeln, das über die Geschichte hinausgeht."],["This example helps explain how the character changes over time.","Dieses Beispiel hilft zu erklären, wie sich die Figur mit der Zeit verändert."],["I would be interested in discussing an alternative interpretation.","Ich würde gerne eine alternative Interpretation diskutieren."],["The author's use of contrast makes this scene more memorable.","Der Einsatz von Gegensätzen macht diese Szene einprägsamer."],["This aspect is important for understanding the work as a whole.","Dieser Aspekt ist wichtig, um das Werk als Ganzes zu verstehen."],["I would not say that the answer is entirely straightforward.","Ich würde nicht sagen, dass die Antwort völlig eindeutig ist."],["To sum up, the passage offers several interesting points for discussion.","Zusammenfassend bietet die Textstelle mehrere interessante Diskussionspunkte."],["Overall, the work raises questions that remain relevant today.","Insgesamt wirft das Werk Fragen auf, die auch heute noch relevant sind."],["In conclusion, the text is open to more than one convincing interpretation.","Abschliessend lässt der Text mehr als eine überzeugende Interpretation zu."]]};const KEY='english-matura-v1';let state;try{state=JSON.parse(localStorage.getItem(KEY)||'{}')}catch{state={}}state.saved??={essay:[],oral:[]};state.stats??={essay:{attempts:0,correct:0},oral:{attempts:0,correct:0}};for(let m of ['essay','oral']){state.saved[m]??=[];state.stats[m]??={attempts:0,correct:0}}let mode='essay',view='today',step=0,typed='',pstep=0,ptyped='',pos=0,queue=[];const store=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}};const norm=s=>s.normalize('NFC').toLocaleLowerCase('fr').replace(/[’‘]/g,"'").replace(/\s+/g,' ').replace(/\s*([,.!?;:])\s*/g,'$1').replace(/[.!?]+$/,'').trim();const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const day=()=>{let d=new Date();return ((Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/86400000)-Math.floor(Date.UTC(2026,0,1)/86400000))%60+60)%60};function setMode(m){mode=m;setView('today')}function setView(v){view=v;step=0;typed='';pstep=0;ptyped='';pos=0;queue=[...state.saved[mode]].sort(()=>Math.random()-.5);render()}function add(i){if(!state.saved[mode].includes(i))state.saved[mode].push(i);store();render()}function remove(i){state.saved[mode]=state.saved[mode].filter(x=>x!==i);store();render()}function check(practice){const i=practice?queue[pos]:day();const ok=norm(practice?ptyped:typed)===norm(BANK[mode][i][0]);state.stats[mode].attempts++;if(ok)state.stats[mode].correct++;store();if(practice)pstep=3;else step=3;render()}function trainer(practice,i){let [fr,de]=BANK[mode][i],s=practice?pstep:step,answer=practice?ptyped:typed;let html='<section><div class="eyebrow">'+(practice?'Repetition '+(pos+1)+' / '+queue.length:'Satz des Tages')+'</div><p class="muted">Satz '+(i+1)+' von 60</p><div class="fr">'+esc(fr)+'</div>';if(s>=1)html+='<div class="de"><b>Deutsch:</b> '+esc(de)+'</div>';if(s>=2)html+='<p><b>Schreibe den englischen Satz:</b></p><textarea id="answer" '+(s===3?'disabled':'')+'></textarea>';if(s===0)html+='<button class="btn" onclick="'+(practice?'pstep':'step')+'=1;render()">Übersetzung aufdecken</button>';if(s===1)html+='<button class="btn" onclick="'+(practice?'pstep':'step')+'=2;render()">Selbst schreiben</button>';if(s===2)html+='<button class="btn" onclick="check('+practice+')">Korrigieren</button>';if(s===3){let ok=norm(answer)===norm(fr);html+='<div class="result '+(ok?'ok':'')+'"><b>'+(ok?'Richtig!':'Noch nicht ganz richtig.')+'</b><p>Musterlösung: '+esc(fr)+'</p></div><div class="row">';if(practice)html+='<button class="btn" onclick="pos++;pstep=0;ptyped=\'\';render()">Nächster Satz</button><button class="btn alt" onclick="pstep=0;ptyped=\'\';render()">Nochmals üben</button>';else html+=(state.saved[mode].includes(i)?'<button class="btn alt" onclick="remove('+i+')">Aus Sammlung entfernen</button>':'<button class="btn green" onclick="add('+i+')">In Sammlung aufnehmen</button>')+'<button class="btn alt" onclick="step=0;typed=\'\';render()">Nochmals üben</button>';html+='</div>'}return html+'</section>'}function render(){for(let m of ['essay','oral'])document.getElementById('m-'+m).classList.toggle('active',mode===m);for(let v of ['today','collection','practice'])document.getElementById('v-'+v).classList.toggle('active',view===v);document.getElementById('count').textContent=state.saved[mode].length;let h='';if(view==='today'){h=trainer(false,day());let s=state.stats[mode];h+='<section><h2>Lernstand</h2><p>60 Sätze · '+state.saved[mode].length+' gespeichert · '+(s.attempts?Math.round(s.correct/s.attempts*100):0)+' % korrekt</p></section>'}else if(view==='collection'){h='<section><h2>Meine Sammlung</h2><p>Hier kannst du deine gespeicherten Sätze repetieren.</p><button class="btn" onclick="setView(\'practice\')">Sammlung trainieren</button></section>';for(let i of state.saved[mode]){let [fr,de]=BANK[mode][i];h+='<div class="item"><b>'+esc(fr)+'</b><p>'+esc(de)+'</p><button class="btn red" onclick="remove('+i+')">Entfernen</button></div>'}if(!state.saved[mode].length)h+='<section>Deine Sammlung ist noch leer.</section>'}else if(!queue.length)h='<section>Speichere zuerst einen Satz in deiner Sammlung.</section>';else if(pos===queue.length)h='<section><h2>Runde abgeschlossen!</h2><button class="btn" onclick="setView(\'practice\')">Neue Runde starten</button></section>';else h=trainer(true,queue[pos]);document.getElementById('app').innerHTML=h;let area=document.getElementById('answer');if(area){area.value=view==='today'?typed:ptyped;area.oninput=e=>{if(view==='today')typed=e.target.value;else ptyped=e.target.value}}}render();

// Tageszähler: Eine offene Tagesübung gilt erst nach der Korrektur als bearbeitet.
const BADGE_DATE_KEY='english-matura-last-completed-day';
const BADGE_FIRST_KEY='english-matura-first-day';
const todayOrdinal=()=>Math.floor(Date.UTC(new Date().getFullYear(),new Date().getMonth(),new Date().getDate())/86400000);
if(localStorage.getItem(BADGE_FIRST_KEY)===null)localStorage.setItem(BADGE_FIRST_KEY,String(todayOrdinal()));
function pendingDays(){const baseline=Number(localStorage.getItem(BADGE_DATE_KEY)??localStorage.getItem(BADGE_FIRST_KEY)??todayOrdinal());return Math.max(0,todayOrdinal()-baseline)}
async function applyBadge(){
 const pending=pendingDays();
 const number=document.getElementById('pending-count');
 if(number)number.textContent=pending===0?'Keine offenen Tage':pending+' offene '+(pending===1?'Tagesübung':'Tagesübungen');
 try{if(pending>0&&typeof navigator.setAppBadge==='function')await navigator.setAppBadge(pending);else if(pending===0&&typeof navigator.clearAppBadge==='function')await navigator.clearAppBadge()}catch(error){console.debug('App-Badge nicht verfügbar:',error)}
}
async function enableBadges(){
 if(!('Notification' in window)){alert('Mitteilungen werden hier nicht unterstützt. Öffne die App direkt über das Home-Bildschirm-Icon auf dem iPhone.');return}
 const permission=await Notification.requestPermission();
 if(permission==='granted'){document.getElementById('badge-permission').style.display='none';applyBadge()}
 else alert('Für die Zahl auf dem Home-Bildschirm-Icon müssen Mitteilungen erlaubt sein.');
}
const checkWithoutBadge=check;
check=function(practice){checkWithoutBadge(practice);if(!practice){localStorage.setItem(BADGE_DATE_KEY,String(todayOrdinal()));applyBadge()}};
const renderWithoutBadge=render;
render=function(){renderWithoutBadge();applyBadge()};
document.getElementById('badge-panel').innerHTML='<div class="eyebrow">Erinnerungszähler</div><p id="pending-count" class="muted">Keine offenen Tage</p><button id="badge-permission" class="btn alt" onclick="enableBadges()">Icon-Zähler aktivieren</button><p class="muted">Nach Mitternacht zählt jeder nicht bearbeitete Tag. Mit der Korrektur des heutigen Satzes beginnt der Zähler wieder bei null. Exakt um 00:01 bei geschlossener App ist ohne Push-Dienst nicht möglich.</p>';
if('Notification' in window&&Notification.permission==='granted')document.getElementById('badge-permission').style.display='none';
applyBadge();
setInterval(applyBadge,30000);
window.addEventListener('focus',applyBadge);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)applyBadge()});


/* Web Push: registration, device-specific authentication and completion sync. */
const pushConfig=window.MATURA_PUSH_CONFIG||{};
const PUSH_DEVICE_ID='english-matura-push-device-id';
const PUSH_DEVICE_TOKEN='english-matura-push-device-token';
const randomCredential=bytes=>Array.from(crypto.getRandomValues(new Uint8Array(bytes)),x=>x.toString(16).padStart(2,'0')).join('');
function deviceCredentials(){
 let id=localStorage.getItem(PUSH_DEVICE_ID),token=localStorage.getItem(PUSH_DEVICE_TOKEN);
 if(!id){id=randomCredential(16);localStorage.setItem(PUSH_DEVICE_ID,id)}
 if(!token){token=randomCredential(32);localStorage.setItem(PUSH_DEVICE_TOKEN,token)}
 return {id,token};
}
function pushAvailable(){return Boolean(pushConfig.apiBase&&/^https:\/\//.test(pushConfig.apiBase))}
async function pushApi(path,payload){
 const {id,token}=deviceCredentials();
 const response=await fetch(pushConfig.apiBase.replace(/\/$/,'')+path,{
  method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
  body:JSON.stringify({id,...payload})
 });
 if(!response.ok)throw new Error('Push-Server: '+response.status);
 return response.json();
}
async function registerPush(){
 if(!pushAvailable()){alert('Die Cloudflare-Anbindung ist noch nicht aktiviert. Die App funktioniert vorerst mit dem lokalen Zähler.');return}
 if(!('serviceWorker' in navigator)||!('PushManager' in window)||!('Notification' in window)){
   alert('Dieses Gerät unterstützt Web Push nicht. Auf dem iPhone bitte die App zuerst zum Home-Bildschirm hinzufügen und über das Icon öffnen.');
   return;
 }
 try{
  const registration=await navigator.serviceWorker.register('./sw.js',{scope:'./'});
  await navigator.serviceWorker.ready;
  const permission=await Notification.requestPermission();
  if(permission!=='granted')return;
  let subscription=await registration.pushManager.getSubscription();
  if(!subscription){
    const keyResponse=await fetch(pushConfig.apiBase.replace(/\/$/,'')+'/public-key');
    if(!keyResponse.ok)throw new Error('Öffentlicher Push-Schlüssel fehlt');
    const {publicKey}=await keyResponse.json();
    if(!publicKey)throw new Error('Push-Schlüssel fehlt');
    const base64=publicKey.replace(/-/g,'+').replace(/_/g,'/');
    const raw=atob(base64.padEnd(Math.ceil(base64.length/4)*4,'='));
    subscription=await registration.pushManager.subscribe({
      userVisibleOnly:true,
      applicationServerKey:Uint8Array.from(raw,c=>c.charCodeAt(0))
    });
  }
  await pushApi('/subscribe',{subscription:subscription.toJSON()});
  const button=document.getElementById('badge-permission');
  if(button){button.textContent='Push-Erinnerungen aktiviert';button.disabled=true;button.style.display='block'}
  applyBadge();
 }catch(error){
  console.error('Push activation failed',error);
  alert('Push-Erinnerungen konnten nicht aktiviert werden: '+error.message);
 }
}
enableBadges=registerPush;
const checkedWithLocalBadge=check;
check=function(practice){
 checkedWithLocalBadge(practice);
 if(!practice&&pushAvailable()&&Notification.permission==='granted'){
   pushApi('/complete',{}).catch(error=>console.warn('Push completion sync delayed',error));
 }
};
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(console.warn);
if(pushAvailable()&&'Notification' in window&&Notification.permission==='granted'){
 const button=document.getElementById('badge-permission');
 if(button){button.textContent='Push-Erinnerungen erneut aktivieren';button.style.display='block'}
}


</script></body></html>
