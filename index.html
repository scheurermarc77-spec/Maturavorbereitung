const FRENCH_PUSH_API='https://kfpxheegmeupnuzqjqqt.supabase.co/functions/v1/matura-push-api';
const M_PUSH_ID='francais-matura-push-device-v3';
const M_PUSH_TOKEN='francais-matura-push-token-v3';
const randomHex=n=>Array.from(crypto.getRandomValues(new Uint8Array(n)),b=>b.toString(16).padStart(2,'0')).join('');
function maturaCredentials(){
 let id=localStorage.getItem(M_PUSH_ID),token=localStorage.getItem(M_PUSH_TOKEN);
 if(!id){id=randomHex(16);localStorage.setItem(M_PUSH_ID,id)}
 if(!token){token=randomHex(32);localStorage.setItem(M_PUSH_TOKEN,token)}
 return {id,token};
}
function maturaStandalone(){return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}
function maturaSupported(){return maturaStandalone()&&'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window}
async function maturaPost(action,extra={}){
 const r=await fetch(FRENCH_PUSH_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...maturaCredentials(),action,...extra})});
 if(!r.ok)throw new Error('Push-Server: '+r.status);
 return r.json();
}
function maturaUpdateText(message){
 const el=document.getElementById('matura-push-state');if(el)el.textContent=message;
}
async function maturaSetBadge(count){
 try{
  if(Number(count)>0&&typeof navigator.setAppBadge==='function')await navigator.setAppBadge(1);
  else if(Number(count)===0&&typeof navigator.clearAppBadge==='function')await navigator.clearAppBadge();
 }catch{}
}
function maturaDecodeKey(key){
 const base=key.replace(/-/g,'+').replace(/_/g,'/');
 const raw=atob(base.padEnd(Math.ceil(base.length/4)*4,'='));
 return Uint8Array.from(raw,c=>c.charCodeAt(0));
}
async function maturaRegister(askPermission){
 if(!maturaSupported()){
  if(askPermission)alert('Bitte die Französisch-App in Safari zum Home-Bildschirm hinzufügen und von dort öffnen.');
  return;
 }
 const registration=await navigator.serviceWorker.register('./sw.js',{scope:'./'});
 await navigator.serviceWorker.ready;
 let permission=Notification.permission;
 if(permission!=='granted'&&askPermission)permission=await Notification.requestPermission();
 if(permission!=='granted'){if(askPermission)maturaUpdateText('Mitteilungen sind nicht aktiviert.');return}
 const kr=await fetch(FRENCH_PUSH_API,{method:'GET'});
 if(!kr.ok)throw new Error('Öffentlicher Schlüssel nicht erreichbar');
 const {publicKey}=await kr.json();
 const publicBytes=maturaDecodeKey(publicKey);
 let sub=await registration.pushManager.getSubscription();
 if(sub&&sub.options&&sub.options.applicationServerKey){
  const old=Array.from(new Uint8Array(sub.options.applicationServerKey));
  if(old.length!==publicBytes.length||old.some((n,i)=>n!==publicBytes[i])){await sub.unsubscribe();sub=null}
 }
 if(!sub)sub=await registration.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:publicBytes});
 const result=await maturaPost('subscribe',{subscription:sub.toJSON()});
 await maturaSetBadge(result.badge);
 const status=await maturaPost('status');
 await maturaSetBadge(status.badge);
 maturaUpdateText(status.badge?'Heute wartet dein Satz auf dich (1).':'Push-Erinnerungen aktiviert. Keine offene Tagesübung.');
 const button=document.getElementById('matura-push-enable');
 if(button)button.textContent='Push-Erinnerungen aktualisieren';
}
async function maturaEnablePush(){
 const button=document.getElementById('matura-push-enable');
 if(button)button.disabled=true;
 try{await maturaRegister(true)}
 catch(error){console.warn('Français Push:',error);maturaUpdateText('Aktivierung fehlgeschlagen. Bitte nochmals versuchen.')}
 finally{if(button)button.disabled=false}
}
const maturaOriginalCheck=check;
check=function(practice){
 maturaOriginalCheck(practice);
 if(!practice){
  maturaSetBadge(0);
  if('Notification' in window&&Notification.permission==='granted'){
   maturaPost('complete').catch(error=>console.warn('Français Tagesabschluss:',error));
  }
  maturaUpdateText('Tagesübung erledigt. Icon-Zähler zurückgesetzt.');
 }
};
const maturaPushPanel=document.getElementById('matura-push-panel');
if(maturaPushPanel){
 maturaPushPanel.innerHTML='<h2>Erinnerung auf dem iPhone</h2><p class="muted">Wenn der Satz des Tages noch offen ist, erscheint um 00:01 Uhr eine rote 1 auf dem App-Icon und eine Mitteilung. Nach der Korrektur wird die 1 zurückgesetzt.</p><p id="matura-push-state" class="muted">Einmalig Push-Erinnerungen aktivieren (iPhone: über Home-Bildschirm öffnen).</p><button id="matura-push-enable" class="btn alt" type="button">Push-Erinnerungen aktivieren</button>';
 document.getElementById('matura-push-enable').addEventListener('click',maturaEnablePush);
}
if('serviceWorker' in navigator){
 navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(console.warn);
 if(maturaSupported()&&Notification.permission==='granted'){
  maturaRegister(false).catch(error=>console.warn('Push-Reaktivierung:',error));
 }
}

</script></body></html>
